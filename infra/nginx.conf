# nginx server block for from-delhi.net (apex index).
#
# Static files. TLS is terminated by Cloudflare; this listens on HTTP.
# Point root at the deployed copy of this repo (or a rsync of it).
# Magic Sort must NOT be served on this server_name.

server {
    listen 80;
    listen [::]:80;
    server_name from-delhi.net www.from-delhi.net;

    root /var/www/from-delhi.net;
    index index.html;

    location / {
        try_files $uri $uri/ =404;
    }

    location ~* \.(css|svg|xml|txt)$ {
        expires 7d;
        add_header Cache-Control "public";
        try_files $uri =404;
    }
}
